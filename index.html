<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06101c">
<title>Square | তিনি আপনাকে কিছু বলতে চান</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --blue:#1F84E8;
    --blue-light:#6FB6FF;
    --blue-deep:#0B4FA3;
    --ink:#06101c;
    --glass:rgba(255,255,255,.07);
    --glass-edge:rgba(255,255,255,.42);
    --text:#F4F7FB;
    --text-dim:rgba(244,247,251,.7);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:transparent;
    font-family:'Hind Siliguri', system-ui, sans-serif;
    color:var(--text);
  }
  a-scene{ width:100vw; height:100vh; }
  .hidden{ opacity:0 !important; pointer-events:none !important; }
  /* The clip is only ever shown as the picture on the AR plane, never as a plain video. */
  #clip{ display:none !important; }

  /* ======================= LANDING ======================= */
  #start{
    position:fixed; inset:0; z-index:40;
    display:grid; place-items:center;
    padding:24px;
    background:
      radial-gradient(90% 60% at 50% 30%, #0e2a4a 0%, var(--ink) 65%, #030910 100%);
    transition:opacity .4s ease, transform .4s ease;
    overflow:hidden;
  }
  #start.away{ opacity:0; transform:scale(1.04); pointer-events:none; }
  #start.gone{ display:none; }

  /* drifting glucose particles */
  .dust{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .dust i{
    position:absolute; bottom:-6vh;
    width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff, var(--blue-light) 55%, transparent 70%);
    opacity:0;
    filter:blur(.3px);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    12%{ opacity:.85; }
    88%{ opacity:.5; }
    100%{ transform:translateY(-112vh) translateX(var(--sway)); opacity:0; }
  }

  /* logo tile */
  .brand{
    position:absolute; top:calc(16px + env(safe-area-inset-top)); left:16px;
    width:54px; height:54px; border-radius:16px;
    background:#fff;
    display:grid; place-items:center;
    box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.6);
    animation:drop .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .brand img{ width:34px; height:auto; display:block; }

  /* day badge */
  .badge{
    position:absolute; top:calc(22px + env(safe-area-inset-top)); right:16px;
    display:flex; align-items:center; gap:8px;
    padding:8px 12px 8px 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    font-size:12px; font-weight:600; letter-spacing:.02em;
    animation:drop .7s .1s cubic-bezier(.2,.8,.2,1) both;
  }
  .badge b{
    width:14px; height:14px; border-radius:50%;
    border:3px solid var(--blue);
    box-shadow:0 0 12px rgba(31,132,232,.8);
    animation:glow 2.4s ease-in-out infinite;
  }
  @keyframes glow{ 0%,100%{ box-shadow:0 0 8px rgba(31,132,232,.5); } 50%{ box-shadow:0 0 18px rgba(31,132,232,1); } }
  @keyframes drop{ from{ opacity:0; transform:translateY(-14px); } to{ opacity:1; transform:none; } }

  /* stage */
  .stage{
    position:relative;
    width:min(86vw, 370px); aspect-ratio:1;
    display:grid; place-items:center;
    animation:pop .9s cubic-bezier(.2,.9,.25,1.15) both;
  }
  @keyframes pop{ from{ opacity:0; transform:scale(.86); } to{ opacity:1; transform:scale(1); } }


  /* the diabetes ring, draws itself */
  .ring{
    position:absolute; inset:0; width:100%; height:100%;
    transform:rotate(-90deg);
    overflow:visible;
  }
  .ring .track{ fill:none; stroke:rgba(255,255,255,.12); stroke-width:5; }
  .ring .draw{
    fill:none; stroke:var(--blue); stroke-width:5; stroke-linecap:round;
    stroke-dasharray:301.6; stroke-dashoffset:301.6;
    animation:draw 1.8s .3s cubic-bezier(.3,.7,.2,1) forwards;
    filter:drop-shadow(0 0 8px rgba(31,132,232,.8));
  }
  .ring .spark{
    fill:none; stroke:#fff; stroke-width:5; stroke-linecap:round;
    stroke-dasharray:14 287.6; opacity:0;
    animation:spin 5s 2.1s linear infinite, fadein .6s 2.1s forwards;
    transform-origin:50% 50%;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes fadein{ to{ opacity:.9; } }

  /* glass disc */
  .glass{
    position:relative; z-index:2;
    width:84%; aspect-ratio:1; border-radius:50%;
    background:var(--glass);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    backdrop-filter:blur(22px) saturate(160%);
    border:1px solid var(--glass-edge);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -30px 60px rgba(255,255,255,.04),
      0 30px 80px rgba(0,0,0,.55);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; padding:28px 30px 36px; text-align:center;
    overflow:hidden;
  }
  .glass::before{
    content:""; position:absolute; inset:-30%;
    background:linear-gradient(115deg, transparent 38%, rgba(255,255,255,.22) 46%, rgba(255,255,255,.05) 52%, transparent 60%);
    transform:rotate(-8deg); pointer-events:none;
  }
  .glass::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(80% 40% at 50% -5%, rgba(255,255,255,.35), transparent 70%);
    pointer-events:none;
  }
  .glass > *{ position:relative; z-index:1; }

  .eyebrow{
    font-size:12px; font-weight:600; letter-spacing:.06em; color:var(--text-dim);
    padding:4px 10px; border-radius:999px;
    border:1px solid rgba(255,255,255,.22);
  }

  .glass h1{
    margin:12px 0 0;
    font-size:clamp(22px, 6.2vw, 28px);
    font-weight:700; line-height:1.35;
    text-shadow:0 2px 16px rgba(0,0,0,.35);
  }

  .glass button{
    margin-top:12px;
    padding:12px 34px; border-radius:999px;
    border:1px solid rgba(255,255,255,.4);
    background:linear-gradient(180deg, rgba(111,182,255,.35), rgba(31,132,232,.35));
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    color:#fff; font-family:inherit; font-size:17px; font-weight:700;
    letter-spacing:.02em; cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 12px 30px rgba(31,132,232,.35);
    transition:transform .16s ease, box-shadow .2s ease;
    position:relative;
  }
  .glass button::after{
    content:""; position:absolute; inset:-1px; border-radius:inherit;
    border:1px solid rgba(255,255,255,.6);
    animation:halo 2.2s ease-out 2.4s infinite;
    pointer-events:none;
  }
  @keyframes halo{ 0%{ transform:scale(1); opacity:.7; } 100%{ transform:scale(1.35); opacity:0; } }
  .glass button:active{ transform:scale(.95); }
  .glass button:disabled{ opacity:.75; }
  .glass button:focus-visible{ outline:2px solid #fff; outline-offset:4px; }

  /* glucose trace along the bottom of the disc */
  .trace{
    position:absolute; left:8%; right:8%; bottom:11%; height:30px; z-index:1;
    opacity:.7;
  }
  .trace path{
    fill:none; stroke:var(--blue-light); stroke-width:1.6; stroke-linecap:round;
    stroke-dasharray:6 8;
    animation:flow 6s linear infinite;
    filter:drop-shadow(0 0 6px rgba(111,182,255,.8));
  }
  @keyframes flow{ to{ stroke-dashoffset:-140; } }

  .foot{
    position:absolute; bottom:calc(20px + env(safe-area-inset-bottom));
    left:0; right:0; text-align:center;
    font-size:11.5px; letter-spacing:.14em; color:rgba(255,255,255,.5);
    font-family:system-ui, sans-serif; font-weight:600;
    animation:drop .7s .3s cubic-bezier(.2,.8,.2,1) both;
  }

  /* ======================= SCANNING ======================= */
  .overlay{
    position:fixed; z-index:30; left:0; right:0;
    display:flex; flex-direction:column; align-items:center;
    pointer-events:none; transition:opacity .4s ease;
  }
  #hint{ bottom:calc(40px + env(safe-area-inset-bottom)); gap:6px; padding:0 26px; text-align:center; }
  #hint strong{ font-size:17px; font-weight:600; color:#fff; text-shadow:0 2px 14px rgba(0,0,0,.6); }
  #hint strong::after{
    content:""; display:inline-block; width:1.4em; text-align:left;
    animation:dots 1.4s steps(4) infinite;
  }
  @keyframes dots{ 0%{ content:""; } 25%{ content:"."; } 50%{ content:".."; } 75%{ content:"..."; } }
  #hint small{ font-size:13.5px; color:rgba(255,255,255,.8); text-shadow:0 2px 12px rgba(0,0,0,.55); }

  #reticle{
    position:fixed; z-index:29; inset:0;
    display:grid; place-items:center; pointer-events:none;
    transition:opacity .4s ease;
  }
  #reticle div{
    --c:#fff;
    position:relative;
    width:min(66vw, 300px); aspect-ratio:4/5;
    background:
      linear-gradient(var(--c),var(--c)) left top/28px 2px no-repeat,
      linear-gradient(var(--c),var(--c)) left top/2px 28px no-repeat,
      linear-gradient(var(--c),var(--c)) right top/28px 2px no-repeat,
      linear-gradient(var(--c),var(--c)) right top/2px 28px no-repeat,
      linear-gradient(var(--c),var(--c)) left bottom/28px 2px no-repeat,
      linear-gradient(var(--c),var(--c)) left bottom/2px 28px no-repeat,
      linear-gradient(var(--c),var(--c)) right bottom/28px 2px no-repeat,
      linear-gradient(var(--c),var(--c)) right bottom/2px 28px no-repeat;
    opacity:.9;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));
    animation:frame 2.6s ease-in-out infinite;
    transition:transform .35s ease, opacity .35s ease, filter .35s ease;
    overflow:hidden;
  }
  @keyframes frame{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.025); } }
  /* scan line */
  #reticle div::after{
    content:""; position:absolute; left:6%; right:6%; top:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--blue-light), #fff, var(--blue-light), transparent);
    box-shadow:0 0 14px rgba(111,182,255,.9);
    animation:sweep 2.2s ease-in-out infinite;
  }
  @keyframes sweep{ 0%{ top:4%; opacity:0; } 10%{ opacity:1; } 90%{ opacity:1; } 100%{ top:96%; opacity:0; } }
  #reticle.locked div{
    --c:var(--blue-light);
    animation:none;
    transform:scale(1.08); opacity:0;
    filter:drop-shadow(0 0 16px rgba(31,132,232,.9));
  }
  #reticle.locked div::after{ display:none; }

  /* lock ripple */
  #ripple{
    position:fixed; z-index:31; left:50%; top:50%;
    width:min(66vw,300px); aspect-ratio:1; border-radius:50%;
    border:3px solid var(--blue);
    transform:translate(-50%,-50%) scale(.4); opacity:0;
    pointer-events:none;
  }
  #ripple.go{ animation:ripple .75s ease-out forwards; }
  @keyframes ripple{ 0%{ transform:translate(-50%,-50%) scale(.4); opacity:.9; } 100%{ transform:translate(-50%,-50%) scale(1.5); opacity:0; } }

  /* glass controls */
  .gbtn{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    color:#fff; font-family:inherit; cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 10px 26px rgba(0,0,0,.35);
  }
  #sound{
    position:fixed; z-index:31;
    top:calc(16px + env(safe-area-inset-top)); right:16px;
    width:44px; height:44px; border-radius:50%;
    font-size:18px; line-height:1;
    display:none; place-items:center;
  }
  #sound.show{ display:grid; }

  #chip{
    position:fixed; z-index:31; left:50%;
    bottom:calc(28px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    display:flex; align-items:center; gap:10px;
    padding:11px 18px; border-radius:999px;
    font-size:14.5px; font-weight:600;
    opacity:0; pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
  }
  #chip.show{ opacity:1; transform:translateX(-50%); pointer-events:auto; }
  #chip i{
    width:9px; height:9px; border-radius:50%; background:#ff5a5f;
    box-shadow:0 0 0 0 rgba(255,90,95,.6);
    animation:live 1.4s ease-out infinite;
  }
  @keyframes live{ 0%{ box-shadow:0 0 0 0 rgba(255,90,95,.6); } 100%{ box-shadow:0 0 0 9px rgba(255,90,95,0); } }
  #chip.replay i{ display:none; }
  #chip.replay::before{ content:"↻"; font-size:17px; }

  #trouble{
    position:fixed; z-index:32; left:14px; right:14px;
    bottom:calc(14px + env(safe-area-inset-bottom));
    padding:14px 18px; border-radius:18px;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(6,16,28,.66);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    color:#fff; font-size:14.5px; line-height:1.55; text-align:center;
    transform:translateY(130%); opacity:0;
    transition:transform .35s ease, opacity .35s ease;
  }
  #trouble.show{ transform:translateY(0); opacity:1; }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>

<body>

<!-- ======================= LANDING ======================= -->
<div id="start">
  <div class="dust" id="dust"></div>

  <div class="brand"><img src="./logo.png" alt="Square"></div>

  <div class="badge"><b></b>১৪ নভেম্বর · বিশ্ব ডায়াবেটিস দিবস</div>

  <div class="stage" id="stage">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="48"></circle>
      <circle class="draw"  cx="50" cy="50" r="48"></circle>
      <circle class="spark" cx="50" cy="50" r="48"></circle>
    </svg>

    <div class="glass">
      <span class="eyebrow">নাসিমা বেগম, ৬১</span>
      <h1>তিনি আপনাকে কিছু বলতে চান।</h1>
      <button id="go" type="button" disabled>লোড হচ্ছে…</button>

      <svg class="trace" viewBox="0 0 200 30" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 18 C 20 18, 25 8, 40 10 S 60 26, 80 20 S 100 6, 120 12 S 145 24, 165 16 S 185 10, 200 14"/>
      </svg>
    </div>
  </div>

  <div class="foot">SQUARE PHARMACEUTICALS PLC</div>
</div>

<!-- ======================= SCANNING ======================= -->
<div id="reticle" class="hidden"><div></div></div>
<div id="ripple"></div>

<div id="hint" class="overlay hidden">
  <strong>কার্ডটি ক্যামেরার সামনে ধরুন</strong>
  <small>পুরো কার্ডটি ফ্রেমের ভেতরে রাখুন</small>
</div>

<button id="sound" class="gbtn" type="button" aria-label="শব্দ চালু বা বন্ধ করুন">♪</button>
<button id="chip"  class="gbtn" type="button"><i></i><span id="chipText">নাসিমা বেগম বলছেন</span></button>

<div id="trouble"></div>

<!-- The clip. Kept outside the scene so the scanner can start without waiting for the whole file. -->
<video id="clip" src="./video_1.mp4" preload="auto" playsinline webkit-playsinline crossorigin="anonymous"></video>

<!-- The AR libraries. They sit here, after the landing screen, so the screen shows while they download. -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js" onerror="window.__libFail=(window.__libFail||[]).concat('aframe')"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js" onerror="window.__libFail=(window.__libFail||[]).concat('mind-ar')"></script>

<!-- ======================= AR SCENE ======================= -->
<a-scene
  id="scene"
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiScanning: no;
    uiLoading: no;
    uiError: no;
    filterMinCF: 0.001;
    filterBeta: 1000;
    missTolerance: 12;
    warmupTolerance: 3"
  color-space="sRGB"
  renderer="colorManagement: true; antialias: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-video id="screen" src="#clip" width="1" height="1.25" position="0 0 0.02" visible="false"
             material="shader: flat; transparent: false"></a-video>
  </a-entity>
</a-scene>

<script>
/* ============================================================
   SETTINGS
   ============================================================ */

// Printed card size in pixels, exactly as sent to the press.
const CARD_WIDTH  = 1080;
const CARD_HEIGHT = 1350;

// 'inside' keeps the whole video within the card. 'width' fills the width and spills over.
const VIDEO_FIT = 'inside';
const VIDEO_SCALE = 1;

// Start the clip over each time the card is found again?
const RESTART_EACH_TIME = true;


/* ============================================================
   Nothing below here needs editing.
   ============================================================ */

const startScreen = document.getElementById('start');
const goButton    = document.getElementById('go');
const hint        = document.getElementById('hint');
const reticle     = document.getElementById('reticle');
const ripple      = document.getElementById('ripple');
const trouble     = document.getElementById('trouble');
const soundBtn    = document.getElementById('sound');
const chip        = document.getElementById('chip');
const chipText    = document.getElementById('chipText');

const scene    = document.getElementById('scene');
const target   = document.getElementById('target');
const screenEl = document.getElementById('screen');
const video    = document.getElementById('clip');

let cameraOn = false, started = false, cardInView = false, troubleTimer = null;

/* --- Drifting particles --- */
(function makeDust(){
  const host = document.getElementById('dust');
  for(let i = 0; i < 16; i++){
    const d = document.createElement('i');
    const size = 3 + Math.random() * 5;
    d.style.left = (Math.random() * 100) + '%';
    d.style.width = d.style.height = size + 'px';
    d.style.setProperty('--sway', ((Math.random() - .5) * 60) + 'px');
    d.style.animationDuration = (11 + Math.random() * 10) + 's';
    d.style.animationDelay = (-Math.random() * 20) + 's';
    host.appendChild(d);
  }
})();

/* --- Fit the video neatly inside the printed card --- */
function sizeVideo(){
  if(!video.videoWidth) return;
  const cardW = 1, cardH = CARD_HEIGHT / CARD_WIDTH;
  const ratio = video.videoWidth / video.videoHeight;
  let w = cardW, h = cardW / ratio;
  if(VIDEO_FIT === 'inside' && h > cardH){ h = cardH; w = cardH * ratio; }
  screenEl.setAttribute('width',  (w * VIDEO_SCALE).toFixed(4));
  screenEl.setAttribute('height', (h * VIDEO_SCALE).toFixed(4));
}
video.addEventListener('loadedmetadata', sizeVideo);

function showTrouble(msg){ trouble.textContent = msg; trouble.classList.add('show'); }
trouble.addEventListener('click', () => trouble.classList.remove('show'));

/* --- Optional on-screen log for testing: add ?debug to the end of the address --- */
const debugBox = /debug/.test(location.search) ? (() => {
  const d = document.createElement('pre');
  d.style.cssText = 'position:fixed;left:6px;top:calc(80px + env(safe-area-inset-top));z-index:99;margin:0;max-width:72vw;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.62);color:#9f9;font:11px/1.35 monospace;white-space:pre-wrap;pointer-events:none';
  document.body.appendChild(d);
  return d;
})() : null;
const debugLines = [];
function dlog(msg){
  if(!debugBox) return;
  debugLines.push((performance.now() / 1000).toFixed(1) + 's ' + msg);
  while(debugLines.length > 12) debugLines.shift();
  debugBox.textContent = debugLines.join('\n');
}
dlog(navigator.userAgent.replace(/^Mozilla\/5\.0 /, '').slice(0, 90));
window.addEventListener('error', (e) => dlog('JS error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => dlog('JS rejection: ' + (e.reason && (e.reason.name || e.reason))));
scene.addEventListener('arReady', () => dlog('scanner ready'));
scene.addEventListener('arError', (e) => dlog('scanner error ' + JSON.stringify(e.detail || '')));

/* --- Wait until the scanner is really ready before offering the button --- */
const BUTTON_LABEL = 'শুনুন';
let ready = false, libsSeenAt = 0, loadFailShown = false;
const pageOpenedAt = Date.now();

function arSystem(){ return (scene.systems && scene.systems['mindar-image-system']) || null; }
function isReady(){ const sys = arSystem(); return !!(window.AFRAME && scene.hasLoaded && sys && sys.ui); }

function markReady(){
  if(ready) return;
  ready = true;
  dlog('libraries + scene ready, button enabled');
  goButton.disabled = false;
  goButton.textContent = BUTTON_LABEL;
  delete goButton.dataset.reload;
  if(loadFailShown){ trouble.classList.remove('show'); loadFailShown = false; }
}
function loadFailed(name){
  if(loadFailShown) return;
  loadFailShown = true;
  dlog('load failed: ' + name);
  showTrouble('পেজটি পুরোপুরি লোড হয়নি। ইন্টারনেট চালু আছে কি না দেখে পেজটি আবার খুলুন। [' + name + ']');
  goButton.disabled = false;
  goButton.textContent = 'আবার চেষ্টা করুন';
  goButton.dataset.reload = '1';
}
function hasWebGL(){
  try{ const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); }catch(e){ return false; }
}
(function waitForReady(){
  if(isReady()) return markReady();
  const waited = Date.now() - pageOpenedAt;
  if(window.__libFail && window.__libFail.length){
    loadFailed('ScriptError: ' + window.__libFail.join(', '));
  }else if(window.AFRAME){
    if(!libsSeenAt) libsSeenAt = Date.now();
    if(Date.now() - libsSeenAt > 20000) loadFailed(!arSystem() ? 'ScriptError: mind-ar' : !hasWebGL() ? 'NoWebGL' : 'LoadTimeout');
  }else if(waited > 45000){
    loadFailed('ScriptError: aframe');
  }
  setTimeout(waitForReady, 150);
})();
scene.addEventListener('loaded', () => { if(isReady()) markReady(); });

/* --- Remember the real camera error name. MindAR itself only reports a generic 'VIDEO_FAIL'. --- */
let lastCameraError = null;
if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
  const realGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
  navigator.mediaDevices.getUserMedia = (constraints) =>
    realGetUserMedia(constraints).then((stream) => { dlog('camera permission granted'); return stream; }).catch((err) => { lastCameraError = err; dlog('camera error: ' + err.name); throw err; });
}
function namedError(name){ const e = new Error(name); e.name = name; return e; }

/* --- Camera on. MindAR's start() returns nothing; success and failure arrive as events. --- */
let cameraStarting = false;
function startCamera(){
  if(cameraOn) return Promise.resolve();
  if(cameraStarting) return Promise.reject(namedError('AlreadyStarting'));
  return new Promise((resolve, reject) => {
    const sys = arSystem();
    if(!sys || !sys.ui) return reject(namedError(sys ? 'SceneNotReady' : 'ScannerMissing'));
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return reject(namedError('NoCameraAPI'));
    cameraStarting = true;
    lastCameraError = null;
    const permissionHint = setTimeout(() => {
      if(!(sys.video && sys.video.srcObject)) showTrouble('ফোন ক্যামেরার অনুমতি চাইলে অনুমতি দিন (Allow)।');
    }, 8000);
    const done = () => {
      clearTimeout(permissionHint); cameraStarting = false;
      scene.removeEventListener('arReady', onReady); scene.removeEventListener('arError', onError);
    };
    const onReady = () => { done(); cameraOn = true; trouble.classList.remove('show'); resolve(); };
    const onError = (e) => {
      done();
      // Remove the dead camera element MindAR leaves behind, so a retry starts clean.
      if(sys.video && !sys.video.srcObject){ sys.video.remove(); sys.video = null; }
      reject(lastCameraError || namedError((e && e.detail && e.detail.error) || 'ARError'));
    };
    scene.addEventListener('arReady', onReady);
    scene.addEventListener('arError', onError);
    dlog('starting camera');
    try{ sys.start(); }catch(err){ done(); reject(err); }
  });
}

function cameraErrorMessage(err){
  const name = (err && err.name) || 'Error';
  let msg;
  if(name === 'NotAllowedError' || name === 'SecurityError') msg = 'ক্যামেরার অনুমতি দেওয়া হয়নি। ব্রাউজারের সেটিংসে ক্যামেরা চালু করে আবার চেষ্টা করুন।';
  else if(name === 'NotFoundError' || name === 'NotReadableError' || name === 'OverconstrainedError' || name === 'AbortError') msg = 'ক্যামেরা পাওয়া যাচ্ছে না। অন্য কোনো অ্যাপ ক্যামেরা ব্যবহার করছে কি না দেখুন।';
  else if(name === 'NoCameraAPI') msg = 'এই ব্রাউজারে ক্যামেরা চালু করা যায় না। লিংকটি Chrome বা Safari-তে খুলুন।';
  else if(name === 'SceneNotReady' || name === 'ScannerMissing') msg = 'স্ক্যানার এখনো তৈরি হয়নি। একটু পরে আবার চেষ্টা করুন।';
  else msg = 'স্ক্যানার চালু করা গেল না।';
  return msg + ' [' + name + ']';
}

/* --- If the clip itself cannot load, say so instead of failing silently later --- */
video.addEventListener('error', () => {
  const code = video.error ? video.error.code : '?';
  showTrouble('ভিডিওটি লোড করা যায়নি। ইন্টারনেট সংযোগ দেখে পেজটি আবার খুলুন। [MediaError ' + code + ']');
});

/* --- Unlock sound during the real finger tap --- */
function unlockAudio(){
  video.muted = false; video.volume = 1;
  video.play().then(() => { video.pause(); video.currentTime = 0; dlog('sound unlocked'); })
  .catch((e) => {
    dlog('sound blocked: ' + (e && e.name));
    video.muted = true; soundBtn.textContent = '✕'; soundBtn.classList.add('show');
    video.play().then(() => { video.pause(); video.currentTime = 0; }).catch(() => {});
  });
}

/* --- The start tap --- */
goButton.addEventListener('click', async () => {
  if(goButton.dataset.reload){ location.reload(); return; }
  dlog('tap');
  goButton.disabled = true;
  unlockAudio();

  // Lift the glass straight away so the tap feels instant, then bring the camera up behind it.
  started = true;
  startScreen.classList.add('away');
  startScreen.addEventListener('transitionend', () => { if(started) startScreen.classList.add('gone'); }, { once:true });
  hint.classList.remove('hidden');
  reticle.classList.remove('hidden');

  try{
    await startCamera();
  }catch(err){
    // Camera refused: bring the glass back so the doctor can try again.
    started = false;
    startScreen.classList.remove('away', 'gone');
    hint.classList.add('hidden');
    reticle.classList.add('hidden');
    dlog('camera failed: ' + ((err && err.name) || err));
    showTrouble(cameraErrorMessage(err));
    goButton.disabled = false; goButton.textContent = 'আবার চেষ্টা করুন';
    return;
  }
  if(cardInView) onFound();

  troubleTimer = setTimeout(() => {
    if(!cardInView) showTrouble('আলো একটু বাড়ান এবং কার্ডটি সমতল করে ধরুন। ক্যামেরা থেকে প্রায় এক হাত দূরে রাখুন।');
  }, 18000);
});

/* --- Card found / lost --- */
function onFound(){
  clearTimeout(troubleTimer);
  hint.classList.add('hidden');
  trouble.classList.remove('show');
  soundBtn.classList.add('show');

  // lock feedback: brackets turn blue and dissolve, a ring ripples out, a light buzz
  reticle.classList.add('locked');
  ripple.classList.remove('go'); void ripple.offsetWidth; ripple.classList.add('go');
  if(navigator.vibrate) navigator.vibrate(35);
  setTimeout(() => { reticle.classList.add('hidden'); reticle.classList.remove('locked'); }, 400);

  chip.classList.remove('replay'); chipText.textContent = 'নাসিমা বেগম বলছেন';
  chip.classList.add('show');

  sizeVideo();
  screenEl.setAttribute('visible', true);
  if(RESTART_EACH_TIME || video.ended) video.currentTime = 0;
  video.play().catch(() => { video.muted = true; soundBtn.textContent = '✕'; video.play().catch(() => {}); });
}

target.addEventListener('targetFound', () => { dlog('card found'); cardInView = true; if(started) onFound(); });

target.addEventListener('targetLost', () => {
  dlog('card lost');
  cardInView = false;
  video.pause();
  screenEl.setAttribute('visible', false);
  chip.classList.remove('show');
  if(started){ hint.classList.remove('hidden'); reticle.classList.remove('hidden'); }
});

/* --- When the clip ends, offer a replay --- */
video.addEventListener('ended', () => {
  dlog('clip ended');
  if(!cardInView) return;
  chip.classList.add('replay'); chipText.textContent = 'আবার শুনুন';
});
chip.addEventListener('click', () => {
  if(!chip.classList.contains('replay')) return;
  video.currentTime = 0;
  video.play().catch(() => {});
  chip.classList.remove('replay'); chipText.textContent = 'নাসিমা বেগম বলছেন';
});

/* --- Sound on and off --- */
soundBtn.addEventListener('click', () => {
  video.muted = !video.muted;
  soundBtn.textContent = video.muted ? '✕' : '♪';
  if(!video.muted && cardInView) video.play().catch(() => { video.muted = true; soundBtn.textContent = '✕'; });
});
</script>

</body>
