<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Square | তিনি আপনাকে কিছু বলতে চান</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<!--
  ============================================================
  SETTINGS YOU MIGHT WANT TO CHANGE LATER
  All of them live in the small SETTINGS block further down,
  just search the page for the word SETTINGS.
  ============================================================
-->

<style>
  :root{
    --ink:#111418;
    --muted:#5d6670;
    --blue:#1F84E8;
    --paper:#ffffff;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    height:100%;
    overflow:hidden;
    background:var(--paper);
    font-family:'Hind Siliguri', system-ui, sans-serif;
    color:var(--ink);
  }

  a-scene{ width:100vw; height:100vh; }

  /* ---------- Opening screen ---------- */
  #start{
    position:fixed; inset:0; z-index:40;
    background:var(--paper);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:32px 28px calc(32px + env(safe-area-inset-bottom));
    text-align:center;
  }

  .mark{
    position:absolute; top:calc(22px + env(safe-area-inset-top)); left:24px;
    display:flex; flex-direction:column; gap:4px; align-items:flex-start;
  }
  .grid{ display:grid; grid-template-columns:repeat(3,12px); gap:3px; }
  .grid i{ display:block; width:12px; height:12px; background:#22B24C; }
  .mark span{ font:700 11px/1 system-ui, sans-serif; letter-spacing:.14em; color:#D8232A; }

  .ring{
    position:relative;
    width:min(62vw, 244px); aspect-ratio:1;
    border-radius:50%;
    border:14px solid var(--blue);
    display:grid; place-items:center;
    margin-bottom:38px;
  }
  .ring::after{
    content:""; position:absolute; inset:-14px;
    pointer-events:none; /* let taps pass through the ring to the button */
    border-radius:50%;
    border:14px solid var(--blue);
    opacity:0;
    animation:pulse 2.8s ease-out 1.2s 2;
  }
  @keyframes pulse{
    0%{ opacity:.45; transform:scale(1); }
    100%{ opacity:0; transform:scale(1.22); }
  }
  .ring button{
    width:64%; aspect-ratio:1; border:0; border-radius:50%;
    background:var(--blue); color:#fff;
    font-family:inherit; font-size:17px; font-weight:600; line-height:1.35;
    cursor:pointer;
    transition:transform .18s ease;
  }
  .ring button:active{ transform:scale(.95); }
  .ring button:focus-visible{ outline:3px solid var(--ink); outline-offset:6px; }

  #start h1{
    margin:0 0 10px;
    font-size:clamp(25px, 6.6vw, 33px);
    font-weight:700; line-height:1.35;
    max-width:17ch;
  }
  #start p{
    margin:0;
    font-size:16px; line-height:1.6; color:var(--muted);
    max-width:26ch;
  }

  /* ---------- Overlays while the camera is open ---------- */
  .overlay{
    position:fixed; z-index:30;
    left:0; right:0;
    display:flex; flex-direction:column; align-items:center;
    pointer-events:none;
  }

  #hint{
    bottom:calc(44px + env(safe-area-inset-bottom));
    gap:7px; padding:0 26px; text-align:center;
    transition:opacity .4s ease;
  }
  #hint strong{
    font-size:18px; font-weight:600; color:#fff;
    text-shadow:0 2px 14px rgba(0,0,0,.55);
  }
  #hint small{
    font-size:14px; color:rgba(255,255,255,.82);
    text-shadow:0 2px 12px rgba(0,0,0,.5);
  }

  /* the corner brackets that frame the card */
  #reticle{
    position:fixed; z-index:29; inset:0;
    display:grid; place-items:center;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  #reticle div{
    width:min(66vw, 300px); aspect-ratio:4/5;
    background:
      linear-gradient(#fff,#fff) left top/26px 2px no-repeat,
      linear-gradient(#fff,#fff) left top/2px 26px no-repeat,
      linear-gradient(#fff,#fff) right top/26px 2px no-repeat,
      linear-gradient(#fff,#fff) right top/2px 26px no-repeat,
      linear-gradient(#fff,#fff) left bottom/26px 2px no-repeat,
      linear-gradient(#fff,#fff) left bottom/2px 26px no-repeat,
      linear-gradient(#fff,#fff) right bottom/26px 2px no-repeat,
      linear-gradient(#fff,#fff) right bottom/2px 26px no-repeat;
    opacity:.82;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.45));
  }

  .hidden{ opacity:0 !important; }

  /* sound toggle */
  #sound{
    position:fixed; z-index:31;
    top:calc(18px + env(safe-area-inset-top)); right:18px;
    width:44px; height:44px; border:0; border-radius:50%;
    background:rgba(17,20,24,.55);
    color:#fff; font-size:19px; line-height:1;
    display:none; place-items:center; cursor:pointer;
    backdrop-filter:blur(6px);
  }
  #sound.show{ display:grid; }

  /* error / fallback message */
  #trouble{
    position:fixed; z-index:32; inset:auto 0 0 0;
    padding:18px 26px calc(18px + env(safe-area-inset-bottom));
    background:rgba(17,20,24,.9);
    color:#fff; font-size:15px; line-height:1.55; text-align:center;
    transform:translateY(105%); transition:transform .35s ease;
  }
  #trouble.show{ transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .ring::after{ animation:none; }
    *{ transition-duration:.01ms !important; }
  }
</style>
</head>

<body>

<!-- ===================== OPENING SCREEN ===================== -->
<div id="start">
  <div class="mark">
    <div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <span>SQUARE</span>
  </div>

  <div class="ring">
    <button id="go" type="button">ক্যামেরা<br>চালু করুন</button>
  </div>

  <h1>তিনি আপনাকে কিছু বলতে চান।</h1>
  <p>ক্যামেরা চালু করে কার্ডটির দিকে তাকান।</p>
</div>

<!-- ===================== CAMERA OVERLAYS ===================== -->
<div id="reticle" class="hidden"><div></div></div>

<div id="hint" class="overlay hidden">
  <strong>কার্ডটি ক্যামেরার সামনে ধরুন</strong>
  <small>পুরো কার্ডটি ফ্রেমের ভেতরে রাখুন</small>
</div>

<button id="sound" type="button" aria-label="শব্দ চালু বা বন্ধ করুন">♪</button>

<div id="trouble">আলো একটু বাড়ান এবং কার্ডটি সমতল করে ধরুন। ক্যামেরা থেকে প্রায় এক হাত দূরে রাখুন।</div>

<!-- ===================== THE AR SCENE ===================== -->
<a-scene
  id="scene"
  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiScanning: no;
    uiLoading: no;
    uiError: no;
    filterMinCF: 0.0001;
    filterBeta: 0.005;
    missTolerance: 12;
    warmupTolerance: 3"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="30000">
    <video id="clip"
           src="./video_1.mp4"
           preload="auto"
           playsinline
           webkit-playsinline
           crossorigin="anonymous"></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-video id="screen"
             src="#clip"
             width="1" height="1.25"
             position="0 0 0.02"
             visible="false"
             material="shader: flat; transparent: false"></a-video>
  </a-entity>
</a-scene>

<script>
/* ============================================================
   SETTINGS
   ============================================================ */

// The printed card's size, in pixels, exactly as you sent it to the press.
// This card is 1080 wide by 1350 tall.
const CARD_WIDTH  = 1080;
const CARD_HEIGHT = 1350;

// How the video sits on the card.
//   'inside' = the whole video fits within the card, nothing cut off.
//              Your 9:16 video ends up full height and about 70% of the
//              card's width, with a strip of printed card either side.
//   'width'  = the video fills the card's full width and spills over the
//              top and bottom edges. Bigger and bolder, less tidy.
const VIDEO_FIT = 'inside';

// Fine tuning on top of the above. 1 is normal. 0.9 shrinks it a little,
// 1.05 grows it a little.
const VIDEO_SCALE = 1;

// Your clip is only 10 seconds, so if the doctor looks away and comes back,
// starting over is kinder than resuming mid sentence. Change to false if you
// would rather it carries on from where it stopped.
const RESTART_EACH_TIME = true;

/* ============================================================
   Nothing below here needs editing.
   ============================================================ */

const startScreen = document.getElementById('start');
const goButton    = document.getElementById('go');
const hint        = document.getElementById('hint');
const reticle     = document.getElementById('reticle');
const trouble     = document.getElementById('trouble');
const soundBtn    = document.getElementById('sound');

const scene  = document.getElementById('scene');
const target = document.getElementById('target');
const screenEl = document.getElementById('screen');
const video  = document.getElementById('clip');

let audioAllowed = false;
let troubleTimer = null;
let hasFound = false;

/* --- Fit the video neatly inside the printed card --- */
function sizeVideo(){
  if(!video.videoWidth) return;

  const cardW = 1;
  const cardH = CARD_HEIGHT / CARD_WIDTH;
  const videoRatio = video.videoWidth / video.videoHeight;

  let w = cardW;
  let h = cardW / videoRatio;

  if(VIDEO_FIT === 'inside' && h > cardH){
    h = cardH;
    w = cardH * videoRatio;
  }

  screenEl.setAttribute('width',  (w * VIDEO_SCALE).toFixed(4));
  screenEl.setAttribute('height', (h * VIDEO_SCALE).toFixed(4));
}
video.addEventListener('loadedmetadata', sizeVideo);

// If the video file itself cannot be loaded, say so instead of failing silently.
video.addEventListener('error', () => {
  trouble.textContent = 'ভিডিওটি লোড করা যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন। [MediaError]';
  trouble.classList.add('show');
});

/* --- The tap that starts everything, and unlocks sound --- */
goButton.addEventListener('click', async () => {
  goButton.disabled = true;

  // Playing the video during a real finger tap is what buys us permission
  // to play it with sound later on, when the card is found.
  try{
    video.muted = false;
    video.volume = 1;
    await video.play();
    video.pause();
    video.currentTime = 0;
    audioAllowed = true;
  }catch(e){
    // The phone refused sound. Fall back to silent, and offer a sound button.
    video.muted = true;
    try{ await video.play(); video.pause(); video.currentTime = 0; }catch(e2){}
    audioAllowed = false;
    soundBtn.classList.add('show');
  }

  startScreen.style.display = 'none';
  hint.classList.remove('hidden');
  reticle.classList.remove('hidden');

  try{
    await scene.systems['mindar-image-system'].start();
  }catch(e){
    startScreen.style.display = 'flex';
    goButton.disabled = false;
    trouble.textContent = 'ক্যামেরা চালু করা গেল না। ব্রাউজারের সেটিংসে ক্যামেরার অনুমতি দিন, তারপর আবার চেষ্টা করুন। [' + (e && e.name ? e.name : 'Error') + ']';
    trouble.classList.add('show');
    return;
  }

  // If the card still has not been found after 18 seconds, offer a nudge.
  troubleTimer = setTimeout(() => {
    if(!hasFound) trouble.classList.add('show');
  }, 18000);
});

/* --- Card found --- */
target.addEventListener('targetFound', () => {
  hasFound = true;
  clearTimeout(troubleTimer);

  hint.classList.add('hidden');
  reticle.classList.add('hidden');
  trouble.classList.remove('show');
  soundBtn.classList.add('show');

  sizeVideo();
  screenEl.setAttribute('visible', true);

  if(RESTART_EACH_TIME || video.ended) video.currentTime = 0;
  video.play().catch(() => {
    video.muted = true;
    video.play().catch(() => {});
  });
});

/* --- Card lost --- */
target.addEventListener('targetLost', () => {
  video.pause();
  screenEl.setAttribute('visible', false);
  hint.classList.remove('hidden');
  reticle.classList.remove('hidden');
});

/* --- Sound on and off --- */
soundBtn.addEventListener('click', () => {
  video.muted = !video.muted;
  soundBtn.textContent = video.muted ? '✕' : '♪';
  if(!video.muted) video.play().catch(() => { video.muted = true; soundBtn.textContent = '✕'; });
});

/* --- Hide the nudge once the doctor taps it away --- */
trouble.addEventListener('click', () => trouble.classList.remove('show'));
</script>

</body>
</html>
